site_name: funcsort
site_url: https://herogold.github.io/funcsort/
site_description: Sort class methods and module-level functions into configurable, regex-matched groups.
repo_url: https://github.com/HEROgold/funcsort
repo_name: HEROgold/funcsort
docs_dir: docs
nav:
  - Home: index.md
  - Configuration: configuration.md
  - Sorting behaviour: sorting-behaviour.md
  - Dependency safety: dependency-safety.md
  - Skipping sorting: nosort.md
  - Example: example.md
  - API Reference:
      - Sorter: reference/sorter.md
      - Groups: reference/groups.md
      - Ordering: reference/ordering.md
      - References: reference/references.md
      - Configuration: reference/config.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            docstring_style: google
            separate_signature: true
            show_symbol_type_toc: true
            merge_init_into_class: true
            members_order: source
            show_if_no_docstring: true
            line_length: 100
            show_root_heading: true
            show_signature: true
            signature_crossrefs: true
            annotations_path: source
            inherited_members: true
            filters: ["!^__weakref__$"]
            extra:
              show_type_annotations: true
markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - attr_list
  - def_list
  - footnotes
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.emoji
theme:
  name: material
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - toc.follow
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/HEROgold/funcsort

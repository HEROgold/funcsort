name: Skylos Analysis

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  skylos:
    name: Skylos Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Skip if these inputs already passed
        id: passed
        uses: ./.github/actions/already-passed
        with:
          name: skylos
          paths: "*.py *.pyi pyproject.toml uv.lock .github/workflows/skylos.yml"

      - name: Setup Python
        if: steps.passed.outputs.hit != 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Skylos
        if: steps.passed.outputs.hit != 'true'
        run: python -m pip install skylos==4.30.0

      - name: Pull Skylos Cloud Policy
        if: steps.passed.outputs.hit != 'true'
        run: |
          skylos sync pull || echo "No Skylos Cloud policy available through GitHub OIDC; continuing with local config."


      - name: Run Skylos Analysis
        if: steps.passed.outputs.hit != 'true'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pr_base_ref="origin/${GITHUB_BASE_REF:-main}"
            skylos . --danger --quality --ai-defects --secrets --sca --baseline --diff-base "$pr_base_ref" --diff "$pr_base_ref" --json -o skylos-results.json
          else
            skylos . --danger --quality --ai-defects --secrets --sca --baseline --json -o skylos-results.json
          fi

      - name: Quality Gate
        if: always() && steps.passed.outputs.hit != 'true'
        run: skylos cicd gate --input skylos-results.json --summary

      - name: GitHub Annotations
        if: always() && steps.passed.outputs.hit != 'true'
        run: skylos cicd annotate --input skylos-results.json

      - name: PR Review Comments
        if: github.event_name == 'pull_request' && always() && steps.passed.outputs.hit != 'true'
        run: |
          pr_base_ref="origin/${GITHUB_BASE_REF:-main}"
          skylos cicd review --input skylos-results.json --diff-base "$pr_base_ref" --evidence-cards
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Remember this pass
        if: steps.passed.outputs.hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.passed.outputs.path }}
          key: ${{ steps.passed.outputs.key }}

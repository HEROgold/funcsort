name: Type Check Public API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: lint-public-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

  lint:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: ruff
            args: "check ."
          - tool: ty
            args: "check . --ignore no-matching-overload"
          - tool: pyrefly
            args: "check ."
          - tool: zuban
            args: "check ."
          - tool: mypy
            args: "."
          - tool: pyright
            args: "."
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Skip if these inputs already passed
        id: passed
        uses: ./.github/actions/already-passed
        with:
          name: lint-public-${{ matrix.tool }}
          paths: "*.py *.pyi pyproject.toml uv.lock ruff.toml .github/workflows/lint-public.yml"

      - name: Install uv (Should be cached from setup job)
        if: steps.passed.outputs.hit != 'true'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Run type checking - ${{matrix.tool}}
        if: steps.passed.outputs.hit != 'true'
        run: uv add ${{matrix.tool}} && uv run ${{matrix.tool}} ${{matrix.args}}

      - name: Remember this pass
        if: steps.passed.outputs.hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.passed.outputs.path }}
          key: ${{ steps.passed.outputs.key }}

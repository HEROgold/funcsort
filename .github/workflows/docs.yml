name: Docs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ opened, reopened, synchronize, closed ]
  workflow_dispatch:

permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages-${{ github.ref_name }}"
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write       # pr-preview-action pushes the preview to the gh-pages branch
      pull-requests: write  # pr-preview-action comments the preview link on the PR
      pages: write          # upload-pages-artifact publishes the built site on main
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: github.event.action != 'closed'
        with:
          python-version: '3.12'

      - name: Install uv
        if: github.event.action != 'closed'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Setup Pages
        if: github.event.action != 'closed'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          # Create the Pages site on first run instead of failing when it does not exist yet.
          enablement: true

      - name: Build docs (mkdocs)
        if: github.event.action != 'closed'
        run: |
          uv sync --group docs
          uv run mkdocs build -d site

      # Only upload artifact if the push is on the main branch
      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

      # Deploy the PR preview on open/sync/reopen; remove it when the PR is closed.
      # pr-preview-action defaults to `action: auto`, which detects the `closed`
      # event and deletes the preview directory from gh-pages.
      - name: Deploy PR Preview
        if: github.event_name == 'pull_request'
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1
        with:
          source-dir: site
          preview-branch: gh-pages
          umbrella-dir: pr-previews

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-docs
    permissions:
      pages: write     # deploy-pages publishes the built site to GitHub Pages
      id-token: write  # deploy-pages uses OIDC to verify the deployment
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

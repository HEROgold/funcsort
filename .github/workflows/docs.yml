name: Docs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ opened, reopened, synchronize, closed ]
  workflow_dispatch:

permissions:
  contents: read

# All deployments push to the shared gh-pages branch, so serialise them to avoid push races.
# Do NOT cancel in-progress runs as we want to allow deployments to complete.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write       # the site and PR previews are pushed to the gh-pages branch
      pull-requests: write  # pr-preview-action comments the preview link on the PR
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: github.event.action != 'closed'
        with:
          python-version: '3.12'

      - name: Install uv
        if: github.event.action != 'closed'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Build docs (zensical)
        if: github.event.action != 'closed'
        run: |
          uv sync --group docs
          uv run zensical build

      # Publish the site to the root of gh-pages on pushes to main, keeping PR previews intact.
      # Gate on the event too: `closed` pull_request events report the base branch as github.ref.
      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: site
          branch: gh-pages
          clean-exclude: pr-previews/
          force: false

      # Deploy the PR preview on open/sync/reopen; remove it when the PR is closed.
      # pr-preview-action defaults to `action: auto`, which detects the `closed`
      # event and deletes the preview directory from gh-pages.
      - name: Deploy PR Preview
        if: github.event_name == 'pull_request'
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1
        with:
          source-dir: site
          preview-branch: gh-pages
          umbrella-dir: pr-previews

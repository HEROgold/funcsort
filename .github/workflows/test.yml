name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency: test-${{ github.sha }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Skip if these inputs already passed
        id: passed
        uses: ./.github/actions/already-passed
        with:
          name: test-${{ matrix.python-version }}
          paths: src tests scripts pyproject.toml uv.lock pytest.toml coverage.toml funcsort.toml .github/workflows/test.yml

      - name: Install uv
        if: steps.passed.outputs.hit != 'true'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        if: steps.passed.outputs.hit != 'true'
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        if: steps.passed.outputs.hit != 'true'
        run: uv sync --group dev

      - name: Run tests
        if: steps.passed.outputs.hit != 'true'
        # Avoid executing examples in CI; they could run untrusted code from PRs
        run: uv run pytest . --ignore=tests/test_examples_run.py

      - name: Remember this pass
        if: steps.passed.outputs.hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.passed.outputs.path }}
          key: ${{ steps.passed.outputs.key }}

name: Bump Version By Labels

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions: {}

jobs:
  bump-version:
    # 41898282 is the github-actions[bot] user ID; unlike the actor login it cannot be spoofed.
    if: github.event.pull_request.merged == true && github.event.sender.id != 41898282
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write # bump-by-label creates the Major/Minor/Patch labels when missing
      pull-requests: write

    steps:
      # skylos: ignore[SKY-D293] bump-by-label runs `git push origin`, which uses the persisted credentials
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.*"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "latest"

      - name: Bump by labels
        uses: HEROgold/bump-by-label@d657045d32bd21631a0830b73abd5207b8acd85a # v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          command: "uv version --bump"
          validate: "uv version"

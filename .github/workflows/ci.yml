name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Skip if these inputs already passed
        id: passed
        uses: ./.github/actions/already-passed
        with:
          name: ci-lint
          paths: "*.py *.pyi pyproject.toml uv.lock ruff.toml .github/workflows/ci.yml"

      - name: Install uv
        if: steps.passed.outputs.hit != 'true'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Set up Python
        if: steps.passed.outputs.hit != 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        if: steps.passed.outputs.hit != 'true'
        run: uv sync

      - name: Run ruff format check
        if: steps.passed.outputs.hit != 'true'
        run: uv run ruff format --check

      - name: Run ruff linter
        if: steps.passed.outputs.hit != 'true'
        run: uv run ruff check

      - name: Remember this pass
        if: steps.passed.outputs.hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.passed.outputs.path }}
          key: ${{ steps.passed.outputs.key }}

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Skip if these inputs already passed
        id: passed
        uses: ./.github/actions/already-passed
        with:
          name: ci-test-${{ matrix.python-version }}
          paths: src tests scripts pyproject.toml uv.lock pytest.toml coverage.toml funcsort.toml .github/workflows/ci.yml

      - name: Install uv
        if: steps.passed.outputs.hit != 'true'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        if: steps.passed.outputs.hit != 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        if: steps.passed.outputs.hit != 'true'
        run: uv sync

      - name: Run tests
        if: steps.passed.outputs.hit != 'true'
        run: uv run pytest -v --cov=funcsort --cov-report=term-missing

      - name: Remember this pass
        if: steps.passed.outputs.hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.passed.outputs.path }}
          key: ${{ steps.passed.outputs.key }}

name: Coverage

on:
  # skylos: ignore[SKY-D290] the job only runs for push runs of this repository's main branch
  workflow_run:
    workflows: ["Test"]
    branches: [main]
    types:
      - completed

permissions:
  contents: read

jobs:
  coveralls-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Coveralls already holds the report for this exact code; re-uploading it adds nothing.
      - name: Skip if these inputs were already uploaded
        id: passed
        uses: ./.github/actions/already-passed
        with:
          name: coverage
          paths: src tests scripts pyproject.toml uv.lock pytest.toml coverage.toml funcsort.toml .github/workflows/coverage.yml

      - name: Install uv
        if: steps.passed.outputs.hit != 'true'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Set up Python 3.13
        if: steps.passed.outputs.hit != 'true'
        run: uv python install 3.13

      - name: Install dependencies
        if: steps.passed.outputs.hit != 'true'
        run: uv sync --group dev

      - name: Run tests with coverage
        if: steps.passed.outputs.hit != 'true'
        run: uv run coverage run --source=. -m pytest tests/

      - name: Upload coverage data to coveralls.io
        if: steps.passed.outputs.hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # skylos: ignore[SKY-D299] upload-only Coveralls token; the job never runs untrusted code
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
          COVERALLS_SERVICE_NAME: github-actions
          COVERALLS_PARALLEL: true
        run: uvx coveralls --service=github

      - name: Coveralls Finished
        if: steps.passed.outputs.hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # skylos: ignore[SKY-D299] upload-only Coveralls token; the job never runs untrusted code
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        run: uvx coveralls --finish

      - name: Remember this upload
        if: steps.passed.outputs.hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.passed.outputs.path }}
          key: ${{ steps.passed.outputs.key }}

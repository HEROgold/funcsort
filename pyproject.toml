[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "hypothesis>=6.161.2",
  "pyrefly>=1.1.1",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.0",
  "ty>=0.0.63",
]

[project]
name = "funcsort"
version = "0.2.0"
description = "Sort class methods and module-level functions into configurable, regex-matched groups"
authors = [{ name = "HEROgold" }]
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = [
  "sorting",
  "code-formatter",
  "linter",
  "python",
  "class-methods",
  "functions",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "confkit[msgspec]>=2.1.0",
  "herogold>=3.6.0",
  "libcst>=1.8.6",
  "rich>=15.0.0",
]

[project.scripts]
funcsort = "funcsort.main:main"

[project.urls]
Homepage = "https://github.com/HEROgold/funcsort"
Repository = "https://github.com/HEROgold/funcsort"
Issues = "https://github.com/HEROgold/funcsort/issues"
